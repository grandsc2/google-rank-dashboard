<title>Local Rank Dashboard</title>
<style>
  :root {
    --bg:      #fdf8f4;
    --surface: #ffffff;
    --surf2:   #fef9f5;
    --text:    #1a0f00;
    --text2:   #78634f;
    --border:  #edd9c8;
    --accent:  #F47820;
    --accent2: #d4620f;
    --up:      #16a34a;
    --down:    #dc2626;
    --flat:    #78634f;
    --r:       12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#1a0f00; --surface:#261600; --surf2:#1f1100;
      --text:#fdf0e4; --text2:#b89474; --border:#4a2e10;
      --accent:#FF9838; --accent2:#ffb060; --up:#4ade80; --down:#f87171;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#1a0f00; --surface:#261600; --surf2:#1f1100;
    --text:#fdf0e4; --text2:#b89474; --border:#4a2e10;
    --accent:#FF9838; --accent2:#ffb060; --up:#4ade80; --down:#f87171;
    color-scheme: dark;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}

  /* header */
  .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
  .hdr-l{display:flex;align-items:center;gap:10px}
  .hdr-icon{width:32px;height:32px;flex-shrink:0;display:grid;place-items:center}
  .hdr-icon img{width:32px;height:32px;object-fit:contain}
  .hdr-title{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .hdr-sub{font-size:12px;color:var(--text2)}

  /* tabs */
  .tabs{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:14px 16px 12px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-loc{font-weight:400;font-size:11px;opacity:.75;margin-left:4px}

  /* main */
  .main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
  .sh{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin:0 0 12px}

  /* rank cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .cdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .ckw{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .metric{background:var(--surf2);border-radius:8px;padding:10px 12px}
  .metric-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
  .metric-val{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1;display:flex;align-items:baseline;gap:6px}
  .metric-val.nr{font-size:14px;color:var(--text2);font-weight:500}
  .metric-change{font-size:11px;font-weight:600}
  .metric-change.up{color:var(--up)} .metric-change.down{color:var(--down)} .metric-change.flat{color:var(--flat)}

  /* chart */
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:28px}
  .chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
  .chart-label{font-size:13px;font-weight:500;color:var(--text)}
  .toggle-group{display:flex;gap:4px}
  .tgl{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s}
  .tgl.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .tgl:hover:not(.active){border-color:var(--accent);color:var(--accent)}
  .chart-wrap{position:relative;height:300px}

  /* reviews */
  .reviews-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:28px}
  .rev-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px}
  .rev-stat{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .rev-big{font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1}
  .rev-label{font-size:12px;color:var(--text2)}
  .rev-trend{font-size:11px;font-weight:600;margin-top:6px}
  .rev-trend.up{color:var(--up)} .rev-trend.down{color:var(--down)} .rev-trend.flat{color:var(--flat)}
  .stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
  .rev-chart-wrap{position:relative;height:80px;margin-top:12px}

  /* table */
  .tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:28px}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{background:var(--surf2);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
  tbody tr:not(:last-child) td{border-bottom:1px solid var(--border)}
  tbody td{padding:9px 14px;vertical-align:middle}
  tbody tr:hover td{background:var(--surf2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-weight:600;font-size:12px;min-width:34px;text-align:center}
  .p1{background:#dcfce7;color:#166534} .p2{background:#dbeafe;color:#1e40af}
  .p3{background:#ede9fe;color:#4c1d95} .p4{background:#fef9c3;color:#854d0e}
  .phi{background:#fee2e2;color:#991b1b} .pnr{background:var(--border);color:var(--text2)}
  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .p1{background:#14532d;color:#86efac}
    :root:not([data-theme="light"]) .p2{background:#1e3a8a;color:#93c5fd}
    :root:not([data-theme="light"]) .p3{background:#2e1065;color:#c4b5fd}
    :root:not([data-theme="light"]) .p4{background:#713f12;color:#fde68a}
    :root:not([data-theme="light"]) .phi{background:#7f1d1d;color:#fca5a5}
  }
  :root[data-theme="dark"] .p1{background:#14532d;color:#86efac}
  :root[data-theme="dark"] .p2{background:#1e3a8a;color:#93c5fd}
  :root[data-theme="dark"] .p3{background:#2e1065;color:#c4b5fd}
  :root[data-theme="dark"] .p4{background:#713f12;color:#fde68a}
  :root[data-theme="dark"] .phi{background:#7f1d1d;color:#fca5a5}

  /* state / footnote */
  .state{text-align:center;padding:64px 24px;color:var(--text2)}
  .state h2{font-size:16px;color:var(--text);margin:0 0 8px}
  .state code,.mono{background:var(--surf2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;font-family:ui-monospace,"Cascadia Code",monospace;color:var(--text)}
  .footnote{font-size:11px;color:var(--text2);text-align:center;margin-top:8px;padding-top:16px;border-top:1px solid var(--border)}

  @media(max-width:600px){
    .hdr,.tabs{padding:0 12px}
    .main{padding:16px 12px 48px}
    .chart-wrap{height:240px}
  }
</style>

<header class="hdr">
  <div class="hdr-l">
    <div class="hdr-icon"><img src="logo-icon.png" alt=""></div>
    <div><div class="hdr-title">Local Rank Dashboard</div></div>
  </div>
  <div id="last-updated" class="hdr-sub"></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="main" id="main">
  <div class="state"><h2>Loading…</h2></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"
  integrity="sha512-6eFEh7bZCWWFNO1gHQKAT8rr1S5NHtLSK+oGxQxBgdCH7RMaG5ElUZU4HNfHNcYVHj2CfqBHTkwjFHkgdH0w=="
  crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// Okabe-Ito CVD-safe palette
const C  = ['#0072B2','#E69F00','#009E73'];
const CB = ['rgba(0,114,178,.12)','rgba(230,159,0,.12)','rgba(0,158,115,.12)'];

let rankData = [], reviewData = [], clients = [];
let activeTab = 0, chartType = 'local', activeCharts = {};

const cv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fd = iso => new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const pillCls = p => !p ? 'pnr' : p===1?'p1':p<=3?'p2':p<=5?'p3':p<=10?'p4':'phi';

async function init() {
  // Prefer data inlined by build_dashboard.py (required for artifact, works on GH Pages too)
  rankData   = window.__RANKINGS__ || [];
  reviewData = window.__REVIEWS__  || [];

  // Fallback: fetch from same origin (GitHub Pages / local http server without build step)
  if (!rankData.length) {
    try {
      const [rr, vr] = await Promise.allSettled([fetch('rankings.json'), fetch('reviews.json')]);
      if (rr.status === 'fulfilled' && rr.value.ok) rankData   = await rr.value.json();
      if (vr.status === 'fulfilled' && vr.value.ok) reviewData = await vr.value.json();
    } catch {}
  }

  if (!rankData.length) {
    document.getElementById('main').innerHTML = `<div class="state"><h2>No data yet</h2>
      <p>Run <code>python scripts/run_check.py</code> to collect rankings.</p></div>`;
    return;
  }

  const seen = new Map();
  for (const r of rankData) {
    const k = `${r.client}||${r.location}`;
    if (!seen.has(k)) seen.set(k, {name: r.client, location: r.location});
  }
  clients = [...seen.values()];

  const latest = rankData.map(r => r.date).sort().at(-1);
  document.getElementById('last-updated').textContent = `Last checked ${fd(latest)}`;
  renderTabs();
  renderClient(0);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = clients.map((c,i) =>
    `<button class="tab ${i===activeTab?'active':''}" onclick="selTab(${i})">
      ${c.name}<span class="tab-loc">${c.location.split(',')[0]}</span>
    </button>`).join('');
}

function selTab(i) { activeTab = i; renderTabs(); renderClient(i); }

function cData(i) {
  const c = clients[i];
  return rankData.filter(r => r.client===c.name && r.location===c.location);
}

function renderClient(i) {
  const data = cData(i);
  const kws   = [...new Map(data.map(r=>[r.keyword,r.keyword])).keys()];
  const dates = [...new Set(data.map(r=>r.date))].sort();
  const c = clients[i];
  const revs = reviewData.filter(r => r.client===c.name && r.location===c.location).sort((a,b)=>a.date.localeCompare(b.date));

  document.getElementById('main').innerHTML = `
    <p class="sh">Current Rankings</p>
    <div class="cards" id="cards"></div>
    <p class="sh">Rank Trend</p>
    <div class="chart-card">
      <div class="chart-hdr">
        <span class="chart-label">Position over time — lower is better</span>
        <div class="toggle-group">
          <button class="tgl ${chartType==='local'?'active':''}" onclick="switchChart('local')">Maps Pack</button>
          <button class="tgl ${chartType==='organic'?'active':''}" onclick="switchChart('organic')">Organic Web</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="rankChart"></canvas></div>
    </div>
    ${revs.length ? `<p class="sh">Reviews &amp; Rating</p><div class="reviews-grid" id="revs"></div>` : ''}
    <p class="sh">Weekly History</p>
    <div class="tbl-card"><div class="tbl-scroll" id="tbl"></div></div>
    <p class="footnote">
      Maps Pack = Google Local Pack position (1 = top of map pack, up to 20 shown). &nbsp;
      Organic = website rank in regular search results. &nbsp; N/R = not found. &nbsp;
      Data collected weekly via SerpAPI &amp; Google Places API.
    </p>`;

  renderCards(data, kws, dates);
  renderRankChart(data, kws, dates);
  if (revs.length) renderReviews(revs);
  renderTable(data, kws, dates);
}

function renderCards(data, kws, dates) {
  const lat = dates.at(-1), prv = dates.at(-2);
  document.getElementById('cards').innerHTML = kws.map((kw,i) => {
    const cur = data.find(r=>r.date===lat&&r.keyword===kw);
    const pre = prv ? data.find(r=>r.date===prv&&r.keyword===kw) : null;

    function metricHtml(pos, prevPos, label) {
      let chg='', cls='';
      if (pos!==null && prevPos!==null) {
        const d = prevPos-pos;
        if (d>0){chg=`↑${d}`;cls='up'} else if(d<0){chg=`↓${Math.abs(d)}`;cls='down'} else{chg='—';cls='flat'}
      } else if (pos!==null && prevPos===null) { chg='NEW'; cls='up'; }
      const valHtml = pos!==null
        ? `<span style="font-size:22px;font-weight:700;letter-spacing:-.03em">#${pos}</span>`
        : `<span style="font-size:14px;font-weight:500;color:var(--text2)">N/R</span>`;
      return `<div class="metric">
        <div class="metric-label">${label}</div>
        <div style="display:flex;align-items:baseline;gap:6px;line-height:1;padding-top:4px">
          ${valHtml}
          ${chg ? `<span class="metric-change ${cls}">${chg}</span>` : ''}
        </div>
      </div>`;
    }

    const mapPos  = cur?.found           ? cur.local_pack_position : null;
    const webPos  = cur?.organic_found   ? cur.organic_position    : null;
    const pmapPos = pre?.found           ? pre.local_pack_position : null;
    const pwebPos = pre?.organic_found   ? pre.organic_position    : null;

    return `<div class="card">
      <div class="card-top">
        <span class="cdot" style="background:${C[i%C.length]}"></span>
        <span class="ckw" title="${kw}">${kw}</span>
      </div>
      <div class="card-metrics">
        ${metricHtml(mapPos, pmapPos, 'Maps Pack')}
        ${metricHtml(webPos, pwebPos, 'Organic')}
      </div>
    </div>`;
  }).join('');
}

function renderRankChart(data, kws, dates) {
  const isOrganic = chartType === 'organic';
  const surf = cv('--surface'), muted = cv('--text2')||'#64748b';

  const datasets = kws.map((kw,i) => ({
    label: kw,
    data: dates.map(d => {
      const r = data.find(x=>x.date===d&&x.keyword===kw);
      if (!r) return null;
      return isOrganic ? (r.organic_found ? r.organic_position : null) : (r.found ? r.local_pack_position : null);
    }),
    borderColor: C[i%C.length],
    backgroundColor: CB[i%CB.length],
    borderWidth: 2,
    pointRadius: 5, pointHoverRadius: 7,
    pointBackgroundColor: C[i%C.length],
    pointBorderColor: surf||'#fff', pointBorderWidth: 2,
    tension: 0.25, spanGaps: false, fill: false,
  }));

  const allPos = data.filter(r=>isOrganic?r.organic_found:r.found)
    .map(r=>isOrganic?r.organic_position:r.local_pack_position);
  const yMax = allPos.length ? Math.max(...allPos)+2 : 12;

  if (activeCharts.rank) activeCharts.rank.destroy();
  activeCharts.rank = new Chart(document.getElementById('rankChart'), {
    type: 'line',
    data: {labels: dates.map(fd), datasets},
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: {mode:'index', intersect:false},
      scales: {
        y: {reverse:true, min:1, max:yMax,
          ticks:{stepSize:1, color:muted},
          grid:{color:'rgba(128,128,128,.1)'}, border:{dash:[3,3]},
          title:{display:true, text:'Position', color:muted, font:{size:11}}},
        x: {ticks:{color:muted}, grid:{color:'rgba(128,128,128,.1)'}, border:{dash:[3,3]}},
      },
      plugins: {
        legend:{position:'top', align:'start', labels:{color:cv('--text')||'#0f172a', usePointStyle:true, pointStyle:'circle', font:{size:12}, padding:20}},
        tooltip:{callbacks:{label: ctx => {
          const v=ctx.parsed.y;
          const lbl=ctx.dataset.label;
          return ` ${lbl.length>38?lbl.slice(0,36)+'…':lbl}: ${v!==null?'#'+v:'N/R'}`;
        }}},
      },
    },
  });
}

function switchChart(type) {
  chartType = type;
  document.querySelectorAll('.tgl').forEach(b => {
    b.classList.toggle('active', (type==='local'&&b.textContent.includes('Maps'))||(type==='organic'&&b.textContent.includes('Organic')));
  });
  const data  = cData(activeTab);
  const kws   = [...new Map(data.map(r=>[r.keyword,r.keyword])).keys()];
  const dates = [...new Set(data.map(r=>r.date))].sort();
  renderRankChart(data, kws, dates);
}

function renderReviews(revs) {
  const latest = revs.at(-1), prev = revs.at(-2);
  const ratChg  = prev?.rating       ? (latest.rating - prev.rating).toFixed(1)       : null;
  const cntChg  = prev?.review_count ? latest.review_count - prev.review_count         : null;

  function trendHtml(chg, unit='') {
    if (chg === null) return '';
    const n = parseFloat(chg);
    if (n > 0)  return `<div class="rev-trend up">↑ +${chg}${unit} from last week</div>`;
    if (n < 0)  return `<div class="rev-trend down">↓ ${chg}${unit} from last week</div>`;
    return `<div class="rev-trend flat">No change from last week</div>`;
  }

  function stars(r) {
    const full=Math.round(r); return '★'.repeat(full)+'☆'.repeat(5-full);
  }

  const ratingCard = latest.rating ? `
    <div class="rev-card">
      <div class="rev-stat">
        <div class="rev-big">${latest.rating.toFixed(1)}</div>
        <div>
          <div class="stars">${stars(latest.rating)}</div>
          <div class="rev-label">Average rating</div>
        </div>
      </div>
      ${trendHtml(ratChg)}
      ${revs.length>1?`<div class="rev-chart-wrap"><canvas id="ratChart"></canvas></div>`:''}
    </div>` : '';

  const countCard = latest.review_count ? `
    <div class="rev-card">
      <div class="rev-stat">
        <div class="rev-big">${latest.review_count.toLocaleString()}</div>
        <div>
          <div style="font-size:13px;font-weight:600;color:var(--text)">reviews</div>
          <div class="rev-label">Total on Google</div>
        </div>
      </div>
      ${trendHtml(cntChg, '')}
      ${revs.length>1?`<div class="rev-chart-wrap"><canvas id="cntChart"></canvas></div>`:''}
    </div>` : '';

  document.getElementById('revs').innerHTML = ratingCard + countCard;

  if (revs.length > 1) {
    const labels = revs.map(r=>fd(r.date));
    const muted = cv('--text2')||'#64748b';

    if (latest.rating && document.getElementById('ratChart')) {
      if (activeCharts.rat) activeCharts.rat.destroy();
      activeCharts.rat = new Chart(document.getElementById('ratChart'), {
        type:'line',
        data:{labels, datasets:[{
          data: revs.map(r=>r.rating),
          borderColor:'#E69F00', backgroundColor:'rgba(230,159,0,.12)',
          borderWidth:2, pointRadius:3, fill:true, tension:0.3
        }]},
        options:{responsive:true, maintainAspectRatio:false,
          scales:{y:{min:1,max:5,ticks:{stepSize:1,color:muted},grid:{color:'rgba(128,128,128,.1)'}},
                  x:{ticks:{color:muted,font:{size:10}},grid:{display:false}}},
          plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`★ ${c.parsed.y}`}}}},
      });
    }

    if (latest.review_count && document.getElementById('cntChart')) {
      if (activeCharts.cnt) activeCharts.cnt.destroy();
      activeCharts.cnt = new Chart(document.getElementById('cntChart'), {
        type:'line',
        data:{labels, datasets:[{
          data: revs.map(r=>r.review_count),
          borderColor:'#009E73', backgroundColor:'rgba(0,158,115,.12)',
          borderWidth:2, pointRadius:3, fill:true, tension:0.3
        }]},
        options:{responsive:true, maintainAspectRatio:false,
          scales:{y:{ticks:{color:muted},grid:{color:'rgba(128,128,128,.1)'}},
                  x:{ticks:{color:muted,font:{size:10}},grid:{display:false}}},
          plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.parsed.y+' reviews'}}}},
      });
    }
  }
}

function renderTable(data, kws, dates) {
  const recent = [...dates].reverse().slice(0, 10);
  const head = kws.map((kw,i) =>
    `<th colspan="2"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${C[i%C.length]};margin-right:5px;vertical-align:middle"></span>${kw}</th>`
  ).join('');
  const subhead = kws.map(()=>`<th>Maps</th><th>Organic</th>`).join('');

  const rows = recent.map(d => {
    const cells = kws.map(kw => {
      const r = data.find(x=>x.date===d&&x.keyword===kw);
      const mp = r?.found          ? r.local_pack_position : null;
      const op = r?.organic_found  ? r.organic_position    : null;
      return `<td><span class="pill ${pillCls(mp)}">${mp!==null?'#'+mp:'N/R'}</span></td>
              <td><span class="pill ${pillCls(op)}">${op!==null?'#'+op:'N/R'}</span></td>`;
    }).join('');
    return `<tr><td>${fd(d)}</td>${cells}</tr>`;
  }).join('');

  document.getElementById('tbl').innerHTML = `<table>
    <thead>
      <tr><th rowspan="2">Date</th>${head}</tr>
      <tr>${subhead}</tr>
    </thead>
    <tbody>${rows}</tbody>
  </table>`;
}

init();
</script>
